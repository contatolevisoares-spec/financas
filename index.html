<!doctype html>
<html lang="pt-BR">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#2f6f4f">
<meta name="robots" content="noindex">

<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--lin:#e3e1da;--pri:#2f6f4f;--pri2:#e4f0e8;--neg:#b3392f;--neg2:#f8e3e0;--warn:#8a5f00;--warn2:#fbf0d3;--inp:#fff;--ontxt:#fff}

:root[data-theme="dark"]{--bg:#151614;--card:#1f201e;--tx:#ecebe6;--mut:#a3a29c;--lin:#33342f;--pri:#6fc195;--pri2:#203a2b;--neg:#ef8a7f;--neg2:#3d2320;--warn:#e7bd55;--warn2:#3a3020;--inp:#262724;--ontxt:#10180f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--lin);padding-top:env(safe-area-inset-top)}
header .wrap{padding-bottom:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:12px 0 6px}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:15px;margin:0 0 6px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;color:var(--mut);padding:8px 10px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--lin);border-radius:12px;padding:14px;margin:12px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--lin);border-radius:12px;padding:10px 12px}
.kpi small{color:var(--mut);display:block;font-size:12px}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums}
.pos{color:var(--pri)}.neg{color:var(--neg)}.mut{color:var(--mut)}.sm{font-size:13px}
.mesnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.mesnav h2{margin:0}.mesnav h2::first-letter{text-transform:uppercase}
.b{border:1px solid var(--lin);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.b.p{background:var(--pri);border-color:var(--pri);color:var(--ontxt)}
.b.d{color:var(--neg)}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px 6px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;border-bottom:1px solid var(--lin);vertical-align:middle;text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
td.v,th.v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.pago td.n>span{text-decoration:line-through;color:var(--mut)}
td.n small{display:block;color:var(--mut);font-size:12px}
tr.ed td{background:var(--pri2)}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--inp);border:1px solid var(--lin);border-radius:8px;padding:6px 8px;min-width:0;max-width:100%}
input.val{width:100px;text-align:right}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 130px}
.row>button,.row>.fix{flex:0 0 auto}
.bar{height:10px;background:var(--lin);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri)}
.cat{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.cat .bar{margin:0}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.dgrid small{display:block;color:var(--mut);font-size:12px}
.dgrid b{font-variant-numeric:tabular-nums}
.aviso,.ok,.erro{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.aviso{background:var(--warn2);color:var(--warn)}.ok{background:var(--pri2);color:var(--pri)}.erro{background:var(--neg2);color:var(--neg)}
details summary{cursor:pointer;color:var(--pri);font-weight:600;margin-top:6px}
.item{border-bottom:1px solid var(--lin);padding:10px 0}
.item:last-child{border:0}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--pri2);color:var(--pri)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.on{opacity:.92}
#porta{max-width:440px;margin:8vh auto;padding:0 16px}
.ajuda li{margin:6px 0}
@media (max-width:560px){.kpi b{font-size:15px}.dgrid{grid-template-columns:repeat(2,1fr)}input.val{width:88px}.hideM{display:none}}
</style>

      <button data-tab="cartao">Cartão</button>
      <button data-tab="dividas">Dívidas</button>

      <button data-tab="resumo">Resumo</button>
      <button data-tab="sync">Drive e senha</button>
      <button data-tab="ajuda">Como usar</button>
    </nav>
  </div></header>
  <main class="wrap" id="view"></main>
</div>
<div id="toast"></div>

/* ---------- utilidades ---------- */
function ymHoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ymAdd(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+String(m).padStart(2,'0')}
function ymNome(ym){if(!ym)return '—';const[y,m]=ym.split('-');return MESES[+m-1]+' de '+y}
function ymCurto(ym){if(!ym)return '—';const[y,m]=ym.split('-');return MESES[+m-1].slice(0,3)+'/'+y.slice(2)}
function diasNoMes(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()}
function diasUteis(ym){const[y,m]=ym.split('-').map(Number);let n=0;for(let d=1;d<=diasNoMes(ym);d++){const w=new Date(y,m-1,d).getDay();if(w>0&&w<6)n++}return n}

/* ---------- criptografia ---------- */
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};

async function derivar(senha,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function cifrar(obj,k=chave,s=sal){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));
  return {app:'minhas-financas',protegido:true,v:2,atualizado:obj.atualizado||null,salt:b64(s),iv:b64(iv),dados:b64(ct)};
}
async function decifrar(env,k){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},k,unb64(env.dados));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function abrirEnvelope(env,senha){const s=unb64(env.salt),k=await derivar(senha,s);const d=await decifrar(env,k);return {d,k,s}}

/* ---------- armazenamento local (sempre criptografado) ---------- */

async function salvar(msg){
  S.atualizado=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(await cifrar(S)));if(msg!==false)toast(msg||'Salvo ✓')}

}

/* ---------- modelo ---------- */
function vazio(){return {versao:2,inicio:ymHoje(),saldoInicial:0,atualizado:null,ultimoBackup:null,categorias:[...CATS_PADRAO],receitas:[],fixos:[],dividas:[],cartoes:[],compras:[],meses:{}}}
function migrar(d){
  if(!d.categorias)d.categorias=[...CATS_PADRAO];
  d.cartoes=d.cartoes||[];d.compras=d.compras||[];
  d.receitas.forEach(r=>{if(!r.cat)r.cat='Renda'});
  d.fixos.forEach(f=>{if(!f.cat)f.cat='Outros'});
  Object.values(d.meses).forEach(m=>{m.pagos=m.pagos||{};m.ajustes=m.ajustes||{};m.lanc=m.lanc||[];m.lanc.forEach(l=>{if(!l.cat)l.cat=l.tipo==='entrada'?'Extra':'Outros'})});
  d.versao=2;return d;
}
const ativo=ym=>it=>(!it.desde||ym>=it.desde)&&(!it.ate||ym<=it.ate);
function mesDados(ym,criar){if(S.meses[ym])return S.meses[ym];const m={dias:null,pagos:{},ajustes:{},lanc:[]};if(criar)S.meses[ym]=m;return m}
function mDiff(a,b){const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)}
function cartao(id){return S.cartoes.find(c=>c.id===id)}
function faturaDe(c,dataISO){const[y,m,d]=dataISO.split('-').map(Number);let off=d>=c.fecha?1:0;if(c.vence<=c.fecha)off++;return ymAdd(y+'-'+String(m).padStart(2,'0'),off)}
function parcelaValor(c,i){const n=c.parcelas||1,p=Math.floor(c.total/n*100)/100;return i===n-1?r2(c.total-p*(n-1)):p}
function pagoCom(sel){return `<option value="">Dinheiro / Pix / Débito</option>`+S.cartoes.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>💳 ${esc(c.nome)}</option>`).join('')}
function faturas(ym){
  const fat={};const add=(cid,it)=>{(fat[cid]=fat[cid]||{itens:[],sim:[]})[it.sim?'sim':'itens'].push(it)};
  S.fixos.filter(ativo(ym)).forEach(f=>{if(f.cartao&&cartao(f.cartao)){const M=mesDados(ym,false),k='fixo:'+f.id;add(f.cartao,{origem:'fixo',id:f.id,nome:f.nome,cat:f.cat,valor:M.ajustes[k]??f.valor,info:'todo mês'})}});
  S.dividas.forEach(d=>{if(d.cartao&&cartao(d.cartao))d.parcelas.forEach(p=>{if(p.mes===ym)add(d.cartao,{origem:'div',id:d.id,pid:p.id,nome:d.nome,cat:'Dívidas',valor:p.valor,info:'parcela de dívida'})})});
  S.compras.forEach(c=>{if(!cartao(c.cartao))return;const i=mDiff(c.inicio,ym),n=c.parcelas||1;if(i>=0&&i<n)add(c.cartao,{origem:'compra',id:c.id,nome:c.desc,cat:c.cat,valor:parcelaValor(c,i),info:n>1?`parcela ${i+1} de ${n}`:'à vista',sim:!!c.simulada})});
  return fat;
}
function calcMes(ym){
  const M=mesDados(ym,false), dias=M.dias??diasUteis(ym), ent=[], sai=[];
  S.receitas.filter(ativo(ym)).forEach(r=>{const k='rec:'+r.id;ent.push({k,tipo:'rec',id:r.id,nome:r.nome,cat:r.cat,obs:r.obs,valor:M.ajustes[k]??r.valor,ajustado:k in M.ajustes,pago:!!M.pagos[k]})});
  S.fixos.filter(ativo(ym)).forEach(f=>{if(f.cartao&&cartao(f.cartao))return;const k='fixo:'+f.id,base=f.tipo==='dia'?r2(f.valor*dias):f.valor;
    sai.push({k,tipo:'fixo',id:f.id,nome:f.nome,cat:f.cat,obs:f.tipo==='dia'?`${brl(f.valor)} × ${dias} dias de trabalho`:(f.obs||'todo mês'),valor:M.ajustes[k]??base,ajustado:k in M.ajustes,pago:!!M.pagos[k]})});
  S.dividas.forEach(d=>{if(d.cartao&&cartao(d.cartao))return;d.parcelas.forEach(p=>{if(p.mes===ym)sai.push({k:'div:'+d.id+':'+p.id,tipo:'div',id:d.id,nome:d.nome,cat:'Dívidas',obs:'parcela de dívida'+(p.obs?' · '+p.obs:''),valor:p.valor,pago:p.pago})})});
  const F=faturas(ym);let simulado=0;const sims=[];
  S.cartoes.forEach(c=>{const f=F[c.id];if(!f)return;f.sim.forEach(x=>{simulado+=x.valor;sims.push(x)});if(!f.itens.length)return;
    const k='fat:'+c.id,base=r2(f.itens.reduce((s,x)=>s+x.valor,0));
    sai.push({k,tipo:'fat',id:c.id,nome:'Fatura '+c.nome,cat:'Cartão',obs:`${f.itens.length} ${f.itens.length>1?'itens':'item'} · vence dia ${c.vence}`,valor:M.ajustes[k]??base,ajustado:k in M.ajustes,pago:!!M.pagos[k],itens:f.itens})});
  M.lanc.forEach(l=>(l.tipo==='entrada'?ent:sai).push({k:'lanc:'+l.id,tipo:'lanc',id:l.id,nome:l.desc,cat:l.cat,obs:[l.dia?'dia '+l.dia:'',l.grupo?'parcelado':'avulso',l.obs].filter(Boolean).join(' · '),valor:l.valor,pago:l.pago,l}));
  const soma=a=>r2(a.reduce((s,x)=>s+(+x.valor||0),0)), E=soma(ent), D=soma(sai);
  return {ent,sai,dias,E,D,sobra:r2(E-D),simulado:r2(simulado),sims,recebido:soma(ent.filter(x=>x.pago)),pago:soma(sai.filter(x=>x.pago)),falta:soma(sai.filter(x=>!x.pago))};
}
function acumulado(ate){if(ate<S.inicio)return null;let s=S.saldoInicial||0,ym=S.inicio;while(ym<=ate){s+=calcMes(ym).sobra;ym=ymAdd(ym,1)}return r2(s)}
function infoDivida(d){
  const pago=r2((d.jaPago||0)+d.parcelas.filter(p=>p.pago).reduce((s,p)=>s+p.valor,0));
  const falta=r2(Math.max(0,d.total-pago));
  const abertas=d.parcelas.filter(p=>!p.pago).sort((a,b)=>a.mes.localeCompare(b.mes));
  const agendado=r2(abertas.reduce((s,p)=>s+p.valor,0));
  return {pago,falta,abertas,agendado,fim:abertas.length?abertas[abertas.length-1].mes:null,pct:d.total?Math.min(100,pago/d.total*100):0};
}
function porCategoria(c){const m={},ad=(cat,v)=>{m[cat||'Outros']=r2((m[cat||'Outros']||0)+v)};c.sai.forEach(x=>{if(x.itens&&!x.ajustado)x.itens.forEach(i=>ad(i.cat,i.valor));else ad(x.cat,x.valor)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}

function telaResumo(){
  let h=`<div class="row" style="align-items:center;margin-top:14px"><h2 style="margin:0">Previsão mês a mês</h2><select id="nResumo" class="fix"><option value="6" ${mesesResumo==6?'selected':''}>6 meses</option><option value="12" ${mesesResumo==12?'selected':''}>12 meses</option><option value="24" ${mesesResumo==24?'selected':''}>24 meses</option></select></div>

  const ini=S.inicio<mesAtual?S.inicio:mesAtual;
  for(let i=0;i<mesesResumo;i++){const ym=ymAdd(ini,i),x=calcMes(ym),a=acumulado(ym),dv=r2(x.sai.filter(s=>s.tipo==='div').reduce((s,y)=>s+y.valor,0));

  h+=`</table><p class="mut sm" style="margin:8px 0 0">Toque no mês para abrir. "Acumulado" soma as sobras desde ${ymNome(S.inicio)}.</p></div>`;
  // gastos por categoria no período
  const tot={};for(let i=0;i<mesesResumo;i++){porCategoria(calcMes(ymAdd(ini,i))).forEach(([n,v])=>tot[n]=r2((tot[n]||0)+v))}
  const cs=Object.entries(tot).sort((a,b)=>b[1]-a[1]),mx=cs.length?cs[0][1]:1;
  if(cs.length)h+=`<h2>Gastos por categoria no período</h2><div class="card">${cs.map(([n,v])=>`<div class="cat"><span>${esc(n)}</span><div class="bar"><i style="width:${(v/mx*100).toFixed(1)}%"></i></div><b class="sm">${brl(v)}</b></div>`).join('')}</div>`;
  return h;
}

/* ---------- Drive: enviar e abrir ---------- */
async function enviar(){
  S.ultimoBackup=new Date().toISOString();
  await salvar(false);
  const env=await cifrar(S), txt=JSON.stringify(env), nome='minhas-financas.json';
  const file=new File([txt],nome,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Minhas Finanças (criptografado)'});toast('Enviado ✓');render();return}
  }catch(e){if(e&&e.name==='AbortError'){S.ultimoBackup=null;await salvar(false);render();return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('Arquivo baixado: coloque na pasta do Drive');render();
}
function escolherArquivo(){const i=$('#arquivo');i.value='';i.click()}
async function abrirArquivo(f){
  let env;try{env=JSON.parse(await f.text())}catch(e){return toast('Esse arquivo não é das Minhas Finanças')}
  if(!env||!env.protegido||env.app!=='minhas-financas'){
    if(env&&Array.isArray(env.dividas)){ // backup antigo sem senha (versão 1)
      if(!S){toast('Backup sem senha: crie uma senha primeiro em "Começar do zero" e abra de novo');return}
      if(confirm('Este é um backup antigo, sem senha. Substituir os dados atuais por ele?')){const k=chave,s=sal;await entrarCom(env,k,s,'Backup restaurado e criptografado')}
      return}
    return toast('Esse arquivo não é das Minhas Finanças')}
  let res=null;
  if(chave&&env.salt===b64(sal)){try{res={d:await decifrar(env,chave),k:chave,s:sal}}catch(e){}}
  if(!res){
    const pw=await pedirSenha('Senha deste arquivo');if(pw===null)return;
    try{res=await abrirEnvelope(env,pw)}catch(e){return toast('Senha errada para este arquivo')}
  }
  if(S&&S.atualizado&&res.d.atualizado&&res.d.atualizado<S.atualizado){
    if(!confirm(`O arquivo é MAIS ANTIGO (${dataHora(res.d.atualizado)}) que o que está aqui (${dataHora(S.atualizado)}). Substituir mesmo assim?`))return}
  const ub=res.d.ultimoBackup;await entrarCom(res.d,res.k,res.s,false);
  S.ultimoBackup=ub||res.d.atualizado;localStorage.setItem(KEY,JSON.stringify(await cifrar(S)));
  toast('Dados abertos do Drive ✓ ('+dataHora(S.atualizado)+')');render();
}
function pedirSenha(titulo){return new Promise(res=>{
  const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px';
  d.innerHTML=`<form class="card" style="max-width:360px;width:100%"><h3>${esc(titulo)}</h3><input type="password" style="width:100%" autocomplete="current-password"><div class="row" style="margin-top:10px;justify-content:flex-end"><button type="button" class="b fix">Cancelar</button><button class="b p fix">Abrir</button></div></form>`;
  document.body.appendChild(d);const inp=d.querySelector('input');inp.focus();
  d.querySelector('button[type=button]').onclick=()=>{d.remove();res(null)};
  d.querySelector('form').onsubmit=e=>{e.preventDefault();const v=inp.value;d.remove();res(v)};
})}

/* ---------- eventos ---------- */
function achaLanc(id){for(const ym in S.meses){const l=S.meses[ym].lanc.find(x=>x.id===id);if(l)return{l,ym}}return{}}
function abreDet(id){const d=document.querySelector(`[data-det="${id}"]`);if(d)d.open=true}
let detAberto=new Set();
function guardaDet(){detAberto=new Set([...document.querySelectorAll('details[data-det]')].filter(d=>d.open).map(d=>d.dataset.det))}
function rerender(){guardaDet();const ae=document.activeElement,chaveFoco=ae&&ae!==document.body?seletor(ae):null;render();detAberto.forEach(abreDet);if(chaveFoco){const el=document.querySelector(chaveFoco);if(el)el.focus()}}
function seletor(el){if(el.id)return '#'+CSS.escape(el.id);for(const a of el.attributes)if(a.name.startsWith('data-'))return `[${a.name}="${CSS.escape(a.value)}"]`;return null}
async function salvaRender(msg){await salvar(msg);setTimeout(rerender,0)}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a');if(!t)return;const ds=t.dataset;
  if(ds.tab){tab=ds.tab;editando=null;render();scrollTo(0,0);return}
  if(ds.tabir){e.preventDefault();tab=ds.tabir;render();scrollTo(0,0);return}
  if(ds.mes!==undefined){mesAtual=ds.mes==='0'?ymHoje():ymAdd(mesAtual,+ds.mes);editando=null;render();return}
  if(ds.ir){e.preventDefault();mesAtual=ds.ir;tab='mes';render();scrollTo(0,0);return}
  if(ds.ircart){e.preventDefault();mesAtual=ds.ircart;render();scrollTo(0,0);return}
  if(ds.delcompra){const c=S.compras.find(x=>x.id===ds.delcompra);if(c&&confirm(`Apagar a compra "${c.desc}"${(c.parcelas||1)>1?' e todas as parcelas':''}?`)){S.compras=S.compras.filter(x=>x!==c);editCompra=null;await salvar('Compra apagada');render()}return}
  if(ds.delcart){const c=cartao(ds.delcart),n=S.compras.filter(x=>x.cartao===c.id).length;
    if(!confirm(`Apagar o cartão "${c.nome}"?${n?` As ${n} compras dele também serão apagadas.`:''} Gastos fixos e dívidas dele passam a contar como dinheiro.`))return;
    S.compras=S.compras.filter(x=>x.cartao!==c.id);S.fixos.forEach(f=>{if(f.cartao===c.id)f.cartao=''});S.dividas.forEach(d=>{if(d.cartao===c.id)d.cartao=''});S.cartoes=S.cartoes.filter(x=>x!==c);await salvar('Cartão apagado');render();return}
  if(ds.editar!==undefined){const[tp,id]=ds.editar.split(':');
    if(!ds.editar){editando=null;editCompra=null;render();return}
    if(tp==='lanc'){editando=editando===id?null:id;render();return}
    if(tp==='compra'){editCompra=editCompra===id?null:id;render();return}
    if(tp==='fat'){tab='cartao';render();scrollTo(0,0);return}
    if(tp==='div'){tab='dividas';render();abreDet(id);document.getElementById('div-'+id).scrollIntoView();return}
    tab='fixos';render();const el=document.querySelector(`[data-${tp==='rec'?'rc':'fx'}="${id}:nome"]`);if(el){el.scrollIntoView({block:'center'});el.focus()}return}
  if(ds.dellanc){const{l,ym}=achaLanc(ds.dellanc);if(l&&confirm('Apagar "'+l.desc+'"?')){S.meses[ym].lanc=S.meses[ym].lanc.filter(x=>x!==l);editando=null;await salvar('Apagado');render()}return}
  if(ds.delgrupo){if(!confirm('Apagar todas as parcelas desta compra (inclusive dos outros meses)?'))return;Object.values(S.meses).forEach(m=>m.lanc=m.lanc.filter(l=>l.grupo!==ds.delgrupo));editando=null;await salvar('Parcelas apagadas');render();return}
  if(ds.deldiv){const d=S.dividas.find(x=>x.id===ds.deldiv);if(d&&confirm('Apagar a dívida "'+d.nome+'" e todas as parcelas?')){S.dividas=S.dividas.filter(x=>x!==d);await salvar('Dívida apagada');render()}return}
  if(ds.pdel){const[a,b]=ds.pdel.split(':');const d=S.dividas.find(x=>x.id===a);d.parcelas=d.parcelas.filter(p=>p.id!==b);await salvaRender();return}
  if(ds.padd){const d=S.dividas.find(x=>x.id===ds.padd);const u=[...d.parcelas].sort((a,b)=>a.mes.localeCompare(b.mes)).pop();
    d.parcelas.push({id:uid(),mes:u?ymAdd(u.mes,1):mesAtual,valor:u?u.valor:0,pago:false,obs:''});await salvaRender();return}
  if(ds.quitar){const d=S.dividas.find(x=>x.id===ds.quitar),m=$('#qm-'+d.id).value||mesAtual,v=num($('#qv-'+d.id).value),ab=d.parcelas.filter(p=>!p.pago),soma=r2(ab.reduce((s,p)=>s+p.valor,0));
    if(!confirm(`Juntar ${ab.length} parcelas (${brl(soma)}) em uma só de ${brl(v)} em ${ymNome(m)}?`))return;
    d.parcelas=d.parcelas.filter(p=>p.pago);d.parcelas.push({id:uid(),mes:m,valor:v,pago:false,obs:'quitação antecipada'});if(v<soma)d.total=r2(d.total-(soma-v));
    await salvaRender('Quitação marcada');return}
  if(ds.rdel){const r=S.receitas.find(x=>x.id===ds.rdel);if(confirm(`Apagar "${r.nome}" de TODOS os meses? (Para parar a partir de um mês, use "Até")`)){S.receitas=S.receitas.filter(x=>x!==r);await salvar('Apagado');render()}return}
  if(ds.fdel){const f=S.fixos.find(x=>x.id===ds.fdel);if(confirm(`Apagar "${f.nome}" de TODOS os meses? (Para parar a partir de um mês, use "Até")`)){S.fixos=S.fixos.filter(x=>x!==f);await salvar('Apagado');render()}return}
  if(ds.catdel){if(confirm('Remover a categoria "'+ds.catdel+'"? Os itens dela continuam com o nome antigo.')){S.categorias=S.categorias.filter(c=>c!==ds.catdel);await salvar();render()}return}
  const ac=ds.acao;if(!ac)return;
  if(ac==='trancar')return trancar();
  if(ac==='radd'){S.receitas.push({id:uid(),nome:'Nova entrada',valor:0,cat:'Renda',obs:'',desde:mesAtual});await salvar();render();const el=document.querySelector(`[data-rc="${S.receitas.at(-1).id}:nome"]`);el.focus();el.select();return}
  if(ac==='fadd'){S.fixos.push({id:uid(),nome:'Novo gasto',valor:0,tipo:'mes',cat:'Outros',obs:'',desde:mesAtual});await salvar();render();const el=document.querySelector(`[data-fx="${S.fixos.at(-1).id}:nome"]`);el.focus();el.select();return}
  if(ac==='enviar')return enviar();
  if(ac==='cadd'){S.cartoes.push({id:uid(),nome:'Novo cartão',fecha:1,vence:10,limite:0});await salvar();render();const el=document.querySelector(`[data-ct="${S.cartoes.at(-1).id}:nome"]`);el.focus();el.select();return}
  if(ac==='abrirArq')return escolherArquivo();
  if(ac==='apagarLocal'){if(confirm('Apagar os dados DESTE aparelho? (O arquivo no Drive não é afetado.)')){try{localStorage.removeItem(KEY)}catch(e){}S=null;chave=null;sal=null;portaCriar()}return}
});

document.addEventListener('change',async e=>{
  const el=e.target,ds=el.dataset;
  if(el.id==='arquivo'){if(el.files[0])abrirArquivo(el.files[0]);return}
  if(!S)return;
  if(ds.pago){const k=ds.pago,[t,a,b]=k.split(':');
    if(t==='lanc')achaLanc(a).l.pago=el.checked;
    else if(t==='div')S.dividas.find(x=>x.id===a).parcelas.find(p=>p.id===b).pago=el.checked;
    else{const M=mesDados(mesAtual,true);el.checked?M.pagos[k]=true:delete M.pagos[k];
      if(t==='fat'){const f=faturas(mesAtual)[a];if(f)f.itens.forEach(i=>{if(i.origem==='div'){const p=S.dividas.find(d=>d.id===i.id).parcelas.find(p=>p.id===i.pid);p.pago=el.checked}})}}
    return salvaRender(el.checked?'Marcado ✓':'Desmarcado')}
  if(ds.val){const k=ds.val,v=num(el.value),[t,a,b]=k.split(':');
    if(t==='lanc')achaLanc(a).l.valor=v;
    else if(t==='div')S.dividas.find(x=>x.id===a).parcelas.find(p=>p.id===b).valor=v;
    else mesDados(mesAtual,true).ajustes[k]=v;
    return salvaRender(t==='rec'||t==='fixo'?'Mudou só neste mês':'Valor alterado')}
  if(ds.le){const[id,c]=ds.le.split(':'),{l,ym}=achaLanc(id);if(!l)return;
    if(c==='mes'){if(el.value&&el.value!==ym){S.meses[ym].lanc=S.meses[ym].lanc.filter(x=>x!==l);mesDados(el.value,true).lanc.push(l);editando=null;await salvar('Movido para '+ymNome(el.value));render()}return}
    l[c]=c==='dia'?(parseInt(el.value,10)||null):el.value;return salvaRender()}
  if(ds.contar){const c=S.compras.find(x=>x.id===ds.contar);c.simulada=!el.checked;return salvaRender(el.checked?'Agora conta na fatura':'Virou simulação')}
  if(ds.cp){const[a,c]=ds.cp.split(':'),cp=S.compras.find(x=>x.id===a);
    if(c==='total')cp.total=num(el.value);else if(c==='parcelas')cp.parcelas=Math.max(1,Math.min(48,parseInt(el.value,10)||1));else if(c==='inicio'){if(el.value)cp.inicio=el.value}else cp[c]=el.value;return salvaRender()}
  if(ds.ct){const[a,c]=ds.ct.split(':'),ct=cartao(a);
    if(c==='nome')ct.nome=el.value;else if(c==='limite')ct.limite=num(el.value);else ct[c]=Math.max(1,Math.min(31,parseInt(el.value,10)||1));return salvaRender()}
  if(el.id==='dias'){const v=parseInt(el.value,10);mesDados(mesAtual,true).dias=isNaN(v)?null:v;return salvaRender()}
  if(ds.ppago||ds.pmes||ds.pval){const[a,b]=(ds.ppago||ds.pmes||ds.pval).split(':'),p=S.dividas.find(x=>x.id===a).parcelas.find(x=>x.id===b);
    if(ds.ppago)p.pago=el.checked;if(ds.pmes&&el.value)p.mes=el.value;if(ds.pval)p.valor=num(el.value);return salvaRender()}
  if(ds.dc){const[a,c]=ds.dc.split(':'),d=S.dividas.find(x=>x.id===a);d[c]=(c==='total'||c==='jaPago')?num(el.value):el.value;return salvaRender()}
  if(ds.rc||ds.fx){const[a,c]=(ds.rc||ds.fx).split(':'),it=(ds.rc?S.receitas:S.fixos).find(x=>x.id===a);
    if(c==='valor')it.valor=num(el.value);else if((c==='desde'||c==='ate')&&!el.value)delete it[c];else it[c]=el.value;return salvaRender()}
  if(el.id==='inicio'&&el.value){S.inicio=el.value;return salvaRender()}
  if(el.id==='saldoIni'){S.saldoInicial=num(el.value);return salvaRender()}
  if(el.id==='nResumo'){mesesResumo=+el.value;render();return}
  if(el.id==='tema'){try{el.value?localStorage.setItem(KEY_TEMA,el.value):localStorage.removeItem(KEY_TEMA)}catch(x){}aplicaTema()}
});

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='fEntrar'){const env=lerLocal();$('#pmsg').innerHTML='<p class="mut">Abrindo…</p>';
    try{const r=await abrirEnvelope(env,$('#pwE').value);await entrarCom(r.d,r.k,r.s)}catch(x){$('#pmsg').innerHTML='<div class="erro">Senha errada. Tente de novo.</div>'}return}
  if(f.id==='fSeed'){const a=$('#sp1').value,b=$('#sp2').value;if(!senhaValida(a,b))return;
    let d;try{d=(await abrirEnvelope(SEED,$('#codSeed').value.trim().toLowerCase())).d}catch(x){$('#pmsg').innerHTML='<div class="erro">Código errado. Confira a mensagem do Claude.</div>';return}
    const s=crypto.getRandomValues(new Uint8Array(16));await entrarCom(d,await derivar(a,s),s,'Pronto! Seus dados estão protegidos 🔒');return}
  if(f.id==='fZero'){const a=$('#zp1').value,b=$('#zp2').value;if(!senhaValida(a,b))return;
    const s=crypto.getRandomValues(new Uint8Array(16));await entrarCom(vazio(),await derivar(a,s),s,'Pronto! Comece cadastrando sua renda');tab='fixos';render();return}
  if(f.id==='fLanc'){const v=num($('#lVal').value);if(!v)return toast('Coloque um valor');
    const tipo=$('#lTipo').value,modo=$('#lModo').value,desc=$('#lDesc').value.trim(),cat=$('#lCat').value,dia=Math.max(1,Math.min(diasNoMes(mesAtual),parseInt($('#lDia').value,10)||1));
    const cart=tipo==='saida'?$('#lPag').value:'',n=modo==='parcelado'?Math.max(2,Math.min(48,parseInt($('#lRep').value,10)||2)):1;
    if(modo==='recorrente'){
      if(tipo==='entrada')S.receitas.push({id:uid(),nome:desc,valor:v,cat:cat==='Outros'?'Renda':cat,obs:'',desde:mesAtual});
      else S.fixos.push({id:uid(),nome:desc,valor:v,tipo:'mes',cat,obs:'',desde:mesAtual,cartao:cart});
      await salvar('Vai aparecer todo mês a partir de '+ymNome(mesAtual));render();return}
    if(cart){const c=cartao(cart),data=mesAtual+'-'+String(dia).padStart(2,'0');
      S.compras.push({id:uid(),cartao:cart,desc,cat,total:v,parcelas:n,inicio:faturaDe(c,data),dataCompra:data,simulada:false});
      await salvar(`No cartão: ${n>1?n+'× de '+brl(parcelaValor({total:v,parcelas:n},0))+', ':''}fatura de ${ymNome(faturaDe(c,data))}`);render();return}
    const grupo=n>1?uid():undefined;
    for(let i=0;i<n;i++)mesDados(ymAdd(mesAtual,i),true).lanc.push({id:uid(),tipo,desc:n>1?`${desc} (${i+1}/${n})`:desc,valor:parcelaValor({total:v,parcelas:n},i),cat,dia,pago:false,obs:'',grupo});
    await salvar(n>1?`Parcelado em ${n} meses`:'Anotado');render();return}
  if(f.id==='fCompra'){const total=num($('#cTotal').value);if(!total)return toast('Coloque o valor');const c=cartao($('#cCart').value),data=$('#cData').value||new Date().toISOString().slice(0,10),n=Math.max(1,Math.min(48,parseInt($('#cParc').value,10)||1));
    S.compras.push({id:uid(),cartao:c.id,desc:$('#cDesc').value.trim(),cat:$('#cCat').value,total,parcelas:n,inicio:faturaDe(c,data),dataCompra:data,simulada:$('#cSim').checked});
    await salvar($('#cSim').checked?'Simulação adicionada':'Compra adicionada');render();return}
  if(f.id==='fDiv'){const total=num($('#dTotal').value),pago=num($('#dPago').value),parc=num($('#dParc').value),ini=$('#dIni').value||ymAdd(ymHoje(),1);
    const d={id:uid(),nome:$('#dNome').value.trim(),total,jaPago:pago,obs:'',cartao:$('#dCart')?$('#dCart').value:'',parcelas:[]};let resto=r2(total-pago),m=ini,n=0;
    if(parc>0)while(resto>0.009&&n<240){const v=Math.min(parc,resto);d.parcelas.push({id:uid(),mes:m,valor:r2(v),pago:false,obs:''});resto=r2(resto-v);m=ymAdd(m,1);n++}
    S.dividas.push(d);await salvar('Dívida criada');render();return}
  if(f.id==='fCat'){const c=$('#novaCat').value.trim();if(c&&!S.categorias.includes(c)){S.categorias.push(c);await salvar('Categoria criada');render()}return}
  if(f.id==='fSenha'){const env=lerLocal();try{await abrirEnvelope(env,$('#pw0').value)}catch(x){return toast('Senha atual errada')}
    const a=$('#pw1').value,b=$('#pw2').value;if(!senhaValida(a,b))return;
    sal=crypto.getRandomValues(new Uint8Array(16));chave=await derivar(a,sal);S.ultimoBackup=null;await salvar('Senha trocada 🔒 Salve no Drive de novo');render();return}
});

/* ---------- dicas dos formulários ---------- */
function dicas(){
  if($('#fLanc')){const tipo=$('#lTipo').value,modo=$('#lModo').value,v=num($('#lVal').value),n=Math.max(2,parseInt($('#lRep').value,10)||2),cart=tipo==='saida'?$('#lPag').value:'',c=cart&&cartao(cart),dia=parseInt($('#lDia').value,10)||1;
    $('#lRepBox').hidden=modo!=='parcelado';$('#lPagBox').hidden=tipo==='entrada';$('#lValRot').textContent=modo==='parcelado'?'Valor total':(modo==='recorrente'?'Valor por mês':'Valor');
    const fat=c?faturaDe(c,mesAtual+'-'+String(Math.min(dia,28)).padStart(2,'0')):null;let t;
    if(modo==='recorrente')t=tipo==='entrada'?`Entra todo mês a partir de ${ymNome(mesAtual)} (vira uma renda fixa).`:`Sai todo mês a partir de ${ymNome(mesAtual)}${c?', na fatura do '+c.nome:''}. Para parar, coloque "Até" em Renda e fixos.`;
    else if(modo==='parcelado')t=`${n}× de ${brl(v/n)} ${c?`no ${c.nome}, a partir da fatura de ${ymNome(fat)}`:`de ${ymCurto(mesAtual)} até ${ymCurto(ymAdd(mesAtual,n-1))}`}.`;
    else t=c?`Compra à vista no ${c.nome}: entra na fatura de ${ymNome(fat)}.`:(tipo==='entrada'?'Entrada só neste mês.':'Gasto só neste mês.');
    $('#lDica').textContent=t}
  if($('#fCompra')){const c=cartao($('#cCart').value),n=Math.max(1,parseInt($('#cParc').value,10)||1),v=num($('#cTotal').value),d=$('#cData').value;
    if(c&&d){const fat=faturaDe(c,d);$('#cDica').textContent=`${n>1?n+'× de '+brl(v/n):'À vista'} · primeira fatura: ${ymNome(fat)}${n>1?' · última: '+ymNome(ymAdd(fat,n-1)):''}`}}
}
document.addEventListener('input',e=>{if(e.target.closest('#fLanc,#fCompra'))dicas()});
document.addEventListener('change',e=>{if(e.target.closest('#fLanc,#fCompra'))dicas()});

/* ---------- tranca automática ---------- */
let saiuEm=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)saiuEm=Date.now();else if(S&&saiuEm&&Date.now()-saiuEm>AUTO_TRANCA_MIN*60000)trancar()});

/* ---------- tema ---------- */
function aplicaTema(){let v='';try{v=localStorage.getItem(KEY_TEMA)||''}catch(e){}if(v)document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme;const s=$('#tema');if(s)s.value=v}

/* ---------- início ---------- */
aplicaTema();
if(!window.crypto||!crypto.subtle){mostraPorta('<div class="card erro">Este navegador não suporta criptografia. Abra em um Chrome, Edge, Firefox ou Safari atualizado.</div>')}
else{lerLocal()?portaEntrar():portaCriar()}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
